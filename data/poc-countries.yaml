# Countries PoC: a separate deck, kept apart from features.yaml. Borders are Natural Earth's default (de facto) view.
# `mainland` keeps only the country's polygons inside a lon/lat box (drops overseas departments and remote islands);
# `expect` is the bbox the selected geometry must fall in, as in features.yaml.
- id: france
  kind: capital
  country: {name: France, ne_id: 1159320637, mainland: [-6, 41, 10, 52], expect: [-5.2, 41.3, 9.6, 51.1]}  # drops French Guiana, the Antilles, Réunion, Mayotte
  city: {name: Paris, ne_id: 1159151613, expect: [2.2, 48.7, 2.5, 49.0]}  # Q90
  uids: {country: aikY3ba3Cy, city: wy4EUbbeSG}

- id: brazil
  kind: capital
  country: {name: Brazil, ne_id: 1159320441, mainland: [-75, -34, -32, 6], expect: [-74.1, -33.8, -32.3, 5.3]}  # drops Trindade, St Peter and St Paul Rocks
