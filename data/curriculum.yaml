# World Atlas curriculum (ADR 0009, docs/world-atlas-plan.md#curriculum). Policy only; the order engine (P3) is the
# mechanism. Status: draft for P3. The country lists are the plan's walk order, not yet the frozen walk.
#
# Id convention, for countries, territories and disputes alike:
# - kebab-case of the short English name the plan uses, ASCII-folded, apostrophes dropped: cote-divoire,
#   sao-tome-and-principe, guinea-bissau, timor-leste.
# - NE's long or formal names are shortened to the common name: brunei, czechia, north-korea, south-korea,
#   dr-congo (COD), congo (COG), laos, eswatini, cabo-verde, gambia, micronesia, russia, vatican.
# - Everything else is spelled out in full: united-kingdom, united-states, united-arab-emirates,
#   saint-vincent-and-the-grenadines, central-african-republic, bosnia-and-herzegovina.
# - Each state id maps to its Natural Earth rows in the `geometry` of its entry in data/countries.yaml (territories and
#   disputes: data/territories.yaml), the one place they are recorded.
# - Ids are unique within countries, territories and disputes. Some equal a feature id in features.yaml (malta, cyprus,
#   taiwan, singapore, sri-lanka, cuba, niger, congo, jordan, crimea, greenland, spratly-islands, falkland-islands);
#   card tags are kind-prefixed (id_country_niger), so that is allowed.
#
# Region fields:
# - frame_margin: optional; the region frame's margin round its members' box, in place of 1.1 (frame.REGION_MARGIN,
#   ADR 0010). For a tall region, whose 16:9 frame is bound north to south and so clips the neighbours there.
# - opener: optional; the region frame feature (an active feature id) that opens the region, or the cluster of the
#   first country it mostly covers (docs/world-atlas-plan.md, "Placing each card type").
# - walk: optional; the frozen neighbour walk over the walk nodes, from entry. Absent: the order engine generates one.
# - entry, exit: where the plan's "Way in" column crosses between regions. Across open water the exit is the member
#   nearest the next entry (united-kingdom → iceland, seychelles → maldives, kiribati → united-states), except
#   bahamas, which the plan names. `python -m geofeat.adjacency` reports each seam's edge or its absence.
# - countries: every member state, in the plan's walk order. Pockets are members too.
# - pockets: states the plan italicises (microstates, enclaves, Kosovo, Palestine). They sit in a host's run instead of
#   being walk nodes (pocket: host). Taiwan, italic in the plan, is a walk node here because it is region 16's exit.
# - subdivisions, territories, disputes: placed by geography (decision 5 default) as pockets (card: host). A
#   subdivision (a constituent country, an exclave) sits right after its host, before the territories.
# - host is a placement anchor only, never a statement of sovereignty (sovereignty lives in the card data). It is the
#   sovereign or administering state when that is a walk node of the region, otherwise the nearest walk node.

# Passes: which cards each holds. Orientation holds the global features (the 4 oceans and the 2 planetary wind bands)
# and the 7 continents; the two ring passes go round the regions below in order.
passes:
  - id: orientation
    name: Orientation
    ring: false
    kinds: [feature, continent]
    global_features: true
  - id: pass-1
    name: Pass 1
    ring: true
    kinds: [country, capital, subdivision, territory, dispute, feature, city]
    feature_tiers: [1, 2]
    city_tiers: [core]
  - id: pass-2
    name: Pass 2
    ring: true
    kinds: [feature, city]
    feature_tiers: [3]
    city_tiers: [secondary]

start: western-europe  # any region can start through a filtered deck

regions:
  - number: 1
    slug: western-europe
    name: Western Europe
    entry: portugal
    exit: united-kingdom
    opener: iberian-peninsula
    way_in: Atlantic, from region 21 (Bahamas)
    countries: [portugal, spain, andorra, france, monaco, belgium, luxembourg, netherlands, united-kingdom, ireland]
    pockets: {andorra: spain, monaco: france}
    subdivisions: {england: united-kingdom, scotland: united-kingdom, wales: united-kingdom, northern-ireland: united-kingdom}
    territories: {gibraltar: united-kingdom, isle-of-man: united-kingdom, jersey: united-kingdom, guernsey: united-kingdom}
    walk: [portugal, spain, france, luxembourg, belgium, netherlands, united-kingdom, ireland]

  - number: 2
    slug: nordic-baltic
    name: Nordic & Baltic
    entry: iceland
    exit: lithuania
    way_in: North Sea
