    territories: {greenland: iceland, faroe-islands: denmark, svalbard: norway}  # greenland: see placements below
    subdivisions: {kaliningrad: lithuania}
    walk: [iceland, norway, denmark, sweden, finland, estonia, latvia, lithuania]

