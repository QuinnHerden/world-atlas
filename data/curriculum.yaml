# Placements decided by the PM and user (decision 5). Each card sits at the default above; the alternatives are kept
# here for the record.
# - greenland: nordic-baltic, host iceland, so it comes right after Iceland (v3.0.0; v2 had north-central-america, host
#   canada). Sovereignty (Kingdom of Denmark, beside Iceland and the Faroes) against geography (North American plate,
#   19 km from Canada). It stays in North America on the continent cards (continents.MEMBERSHIP).
# - kuril-islands (retired in v3.0.1): east-asia, host japan (alternative eastern-europe, host russia). Geography (the
#   southern four lie off Hokkaido; the dispute is Japan's claim) against the administering power, Russia.
# - bermuda: north-central-america, host united-states (alternative caribbean, host bahamas). Geography (nearest state
#   the United States, about 1,040 km) against the ring (on the Bahamas → Atlantic → Iberia exit, with the hurricane
#   belt and the Gulf Stream).
# - aruba, curacao: south-america, host venezuela (alternative caribbean, no host chosen). Geography (on the South
#   American shelf, just off the Venezuelan coast) against the Caribbean region they are usually grouped with.

# Curated country look-alikes (ADR 0009). The 3–10 card window applies to the members of a set that share a region; it
# is waived across regions, so the cross-region sets (austria/australia, iran/iraq, mali/malawi, and equatorial-guinea
# within its set) only reach the blurbs and any later look-alike check. Ids may be dispute cards (somaliland). Feature
# sibling pairs come from the pair check, not from here.
confusables:
  - [niger, nigeria]
  - [guinea, guinea-bissau, equatorial-guinea]
  - [congo, dr-congo]
  - [sudan, south-sudan]
  - [slovakia, slovenia]
  - [rwanda, burundi]
  - [dominica, dominican-republic]
  - [somalia, somaliland]
  - [austria, australia]
  - [iran, iraq]
  - [mali, malawi]
