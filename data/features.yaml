    world's largest concentration of conventional oil (Ghawar).
  style: area
  # The peninsula's interior: the peninsula less NE's highland and coastal-plain polygons, the Syrian Desert to the
  # north, and a hand-drawn Yemen highlands cut; the largest piece is kept, dropping cut-off coastal scraps.
  # Britannica gives about 2.33 million km², but that leaves the highlight 82% the peninsula's (IoU limit 0.8).
  geometry:
  - {feature: arabian-peninsula}
  - {layer: 10m_geography_regions_polys, select: {ne_id: 1730073417}, subtract: true}  # Hejaz Mts.
  - {layer: 10m_geography_regions_polys, select: {ne_id: 1730073421}, subtract: true}  # Asir Mts.
  - {layer: 10m_geography_regions_polys, select: {ne_id: 1730072137}, subtract: true}  # Tihamah
  - {file: yemen-highlands-clip.geojson, subtract: true}
  - {layer: 10m_geography_regions_polys, select: {ne_id: 1730072769}, subtract: true}  # Hadhramaut
  - {layer: 10m_geography_regions_polys, select: {ne_id: 1730071661}, subtract: true}  # Al Hajar Mts.
  - {layer: 10m_geography_regions_polys, select: {ne_id: 1159103173}, subtract: true}  # Musandam Peninsula
  - {layer: 10m_geography_regions_polys, select: {ne_id: 1730072141}, subtract: true}  # Hasa Plain (Gulf coastal lowland)
  - {layer: 10m_geography_regions_polys, select: {ne_id: 1159104075}, subtract: true}  # Syrian Desert, a separate desert
  trim_to_largest: true
  expect: {bbox: [34.5, 12.5, 60, 31.5], area_km2: [2100000, 2500000]}
  allow_nested:
  - id: arabian-peninsula
    reason: Different features (desert vs peninsula); the desert excludes the Hejaz/Asir, Yemen and Oman highlands and the coastal plains

