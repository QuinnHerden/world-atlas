# Territory and dispute cards (docs/world-atlas-plan.md#territories, ADR 0008). Outlines from
# docs/research/ne-political-layers.md (b); notes verbatim from docs/research/blurbs/d-americas-continents-territories-disputes.md (ws/blurbs-d).
# Region and host are not stored here: they come from data/curriculum.yaml's territories and disputes maps, and every id
# must be placed there. The adjacency graph and the region outlines read `geometry` too (countries_ne.py). parties:
# states or authorities that claim or administer the area, not backers or recognisers; a self-declared entity is
# labelled by its short common name.
# frame: the card's own exception to the framing rules, as in countries.yaml.

- kind: territory
  id: gibraltar
  uid: sxVSFSgNxX
  name: Gibraltar
  sovereign: united-kingdom
  status_line: British Overseas Territory
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320719}}
  expect: [-5.4, 36, -5.3, 36.2]
  note: Gibraltar is a British Overseas Territory on a narrow peninsula on Spain's southern coast, overlooking the Strait of Gibraltar. Spain ceded it to Britain in the 1713 Treaty of Utrecht but still claims it, and Gibraltarians voted against shared sovereignty in 2002. A UK–EU treaty on Gibraltar's relations with the EU, signed in July 2026, opened the land border with Spain without prejudice to either country's position on sovereignty.

- kind: territory
  id: isle-of-man
  uid: 4Pm3f8UGys
  name: Isle of Man
  sovereign: united-kingdom
  status_line: British Crown Dependency
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320721}}
  expect: [-4.9, 54, -4.2, 54.5]
  note: The Isle of Man is a British Crown Dependency in the Irish Sea, between Great Britain and Ireland. It governs itself and is not part of the UK, which remains responsible for its defence and international relations.

- kind: territory
  id: jersey
  uid: O2CcjOTVB5
  name: Jersey
  sovereign: united-kingdom
  status_line: British Crown Dependency
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320725}}
  expect: [-2.3, 49.1, -1.9, 49.3]
  note: Jersey is a British Crown Dependency, the larger of the two Channel Islands bailiwicks, off the north-west coast of France. It governs itself and is not part of the UK, which handles its defence and international relations; the Channel Islands are the last remnant of the medieval Duchy of Normandy.

- kind: territory
  id: guernsey
  uid: 1NqqYsJrV3
  name: Guernsey
  sovereign: united-kingdom
  status_line: British Crown Dependency
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320715}}
  expect: [-2.7, 49.3, -2.1, 49.8]
  note: The Bailiwick of Guernsey is a British Crown Dependency in the Channel Islands, off the north-west coast of France, and includes Alderney, Sark and smaller islands besides Guernsey itself. Like Jersey it governs itself and is not part of the UK; the Channel Islands were the only British soil Germany occupied in the Second World War.

- kind: territory
  id: faroe-islands
  uid: qrWS4MkxPk
  name: Faroe Islands
  sovereign: denmark
  status_line: Autonomous territory of the Kingdom of Denmark
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320549}}
  expect: [-7.7, 61.3, -6.2, 62.5]
  note: The Faroe Islands are a self-governing part of the Kingdom of Denmark, with home rule since 1948; Denmark remains responsible for justice and defence. The archipelago lies in the North Atlantic about halfway between Iceland and Norway, and unlike Denmark it is not in the EU.

- kind: territory
  id: svalbard
  uid: EwmpmvdJqb
  name: Svalbard
  sovereign: norway
  status_line: Part of the Kingdom of Norway, under the Svalbard Treaty
  geometry:
  - {layer: 10m_admin_0_map_units, select: {ne_id: 1159321119}}
  expect: [10.4, 74.3, 33.7, 80.8]
  note: Svalbard is an Arctic archipelago north of mainland Norway and part of the Kingdom of Norway, run by a governor in Longyearbyen. A 1920 treaty recognised Norway's sovereignty; coal mining built its settlements, including Russian-run Barentsburg, and Norway's last coal mine closed in 2025.

- kind: territory
  id: reunion
  uid: HXEV8bNubz
  name: Réunion
  sovereign: france
  status_line: Overseas department of France (part of France)
  geometry:
  - {layer: 10m_admin_0_map_units, select: {ne_id: 1159320661}}
  expect: [55.2, -21.4, 55.9, -20.8]
  note: Réunion is an overseas department and region of France, a rugged, mountainous island in the Indian Ocean east of Madagascar, and an outermost region of the EU.

- kind: territory
  id: british-indian-ocean-territory
  uid: 7mYsBdrYS2
  name: British Indian Ocean Territory
  sovereign: united-kingdom
  status_line: British Overseas Territory
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320723}}
  expect: [71.2, -7.5, 72.6, -5.2]
  note: The British Indian Ocean Territory, a British Overseas Territory, is the Chagos Archipelago in the central Indian Ocean; its only inhabited island, Diego Garcia, hosts a joint UK–US military base, and the islanders were removed between 1967 and 1973. Mauritius long claimed it, and a treaty signed on 22 May 2025 provides for transferring sovereignty to Mauritius while the UK keeps rights over the Diego Garcia base for an initial 99 years.

- kind: territory
  id: hong-kong
  uid: aeP3lCgeob
  name: Hong Kong
  sovereign: china
  status_line: Special administrative region of China
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320473}}
  expect: [113.8, 22.1, 114.5, 22.6]
  note: Hong Kong is a special administrative region (SAR) of China on the South China Sea coast. A British colony from the 1840s, it returned to China on 1 July 1997 under the "one country, two systems" formula, which promised it a high degree of autonomy, except in foreign and defence affairs, for 50 years.

- kind: territory
  id: macau
  uid: JkVUrK1klg
  name: Macau
  alt_names: [Macao]
  sovereign: china
  status_line: Special administrative region of China
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320475}}
  expect: [113.4, 22, 113.7, 22.3]
  note: Macau is a special administrative region of China on the South China Sea coast, near Hong Kong. Portuguese traders settled there in the 1550s, making it the first European settlement in the Far East, and Portugal returned it to China in 1999 under the same "one country, two systems" formula as Hong Kong.

- kind: territory
  id: guam
  uid: 5CCAzl4q4B
  name: Guam
  sovereign: united-states
  status_line: Unincorporated territory of the United States
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159321359}}
  expect: [144.6, 13.2, 145, 13.7]
  note: Guam is an unincorporated organized territory of the United States in the western Pacific, about three-quarters of the way from Hawaii to the Philippines. The US took it from Spain in 1898; Japan occupied it from 1941 until US forces retook it in 1944.

- kind: territory
  id: new-caledonia
  uid: F0LFVO5J4K
  name: New Caledonia
  sovereign: france
  status_line: Sui generis collectivity of France
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320641}}
  expect: [163.5, -22.7, 171.4, -19.6]
  note: 'New Caledonia is a French "sui generis" collectivity, a status of its own between an overseas department and an independent country, on islands in the South Pacific east of Australia; nickel mining has shaped it since the 1860s. Under the 1998 Nouméa Accord it voted against independence in 2018, 2020 and 2021, the last vote boycotted by key Kanak groups. In April 2026 the French National Assembly rejected the constitutional bill implementing the 2025 Bougival and 2026 Élysée-Oudinot accords, which would have created a "State of New Caledonia" within France, and long-delayed provincial elections were held in June 2026.'

- kind: territory
  id: french-polynesia
  uid: jhQObGpnp5
  name: French Polynesia
  sovereign: france
  status_line: Overseas collectivity of France
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320643}}
  expect: [-154.6, -27.7, -134.9, -7.9]
  note: French Polynesia is an overseas collectivity of France, styled an "overseas country", made up of five archipelagos in the South Pacific roughly halfway between South America and Australia; Tahiti is its main island. France tested nuclear weapons at Mururoa and Fangataufa atolls from 1966 to 1996, and the UN relisted the territory as non-self-governing in 2013.

- kind: territory
  id: greenland
  uid: 24rdGoHY6W
  name: Greenland
  sovereign: denmark
  status_line: Autonomous territory of the Kingdom of Denmark
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320551}}
  expect: [-73.1, 59.7, -11.3, 83.7]
  note: "Greenland is a self-governing part of the Kingdom of Denmark: it gained home rule in 1979 and wider self-government in 2009, while Denmark keeps foreign affairs, security and financial policy. Geographically in North America, north-east of Canada, it is the world's largest island and mostly ice-capped. A US–Denmark–Greenland defence agreement signed in September 2026 provides for more US military sites, and in it the US affirms the Kingdom of Denmark's sovereignty."

- kind: territory
  id: bermuda
  uid: Y0qD2nJ79g
  name: Bermuda
  sovereign: united-kingdom
  status_line: British Overseas Territory
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320705}}
  expect: [-65, 32.2, -64.6, 32.5]
  note: Bermuda is a British Overseas Territory, an island group in the North Atlantic east of South Carolina, well north of the Caribbean. First settled in 1609 by shipwrecked English colonists, it is the oldest British Overseas Territory and a major offshore financial centre.

- kind: territory
  id: falkland-islands
  uid: t2hN6mRzGI
  name: Falkland Islands
  alt_names: [Islas Malvinas]
  sovereign: united-kingdom
  status_line: British Overseas Territory
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320711}}
  expect: [-61.4, -52.5, -57.7, -51]
  note: The Falkland Islands are a British Overseas Territory in the South Atlantic, east of southern Argentina. Argentina, which calls them the Islas Malvinas, claims them; it invaded in 1982 and British forces retook them that June, and in 2013 islanders voted to remain British.

- kind: territory
  id: french-guiana
  uid: uw5Db9n4FQ
  name: French Guiana
  sovereign: france
  status_line: Overseas department of France (part of France)
  geometry:
  - {layer: 10m_admin_0_map_units, select: {ne_id: 1159320655}}
  expect: [-54.7, 2, -51.6, 5.8]
  note: French Guiana is a French overseas region on the north-east coast of South America, between Suriname and Brazil, run by a single territorial collectivity with the powers of both an overseas department and region, and it is an outermost region of the EU. France's Guiana Space Centre at Kourou also serves as the European Space Agency's spaceport.

- kind: territory
  id: aruba
  uid: wVdA6IiArU
  name: Aruba
  sovereign: netherlands
  status_line: Constituent country of the Kingdom of the Netherlands
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159321097}}
  expect: [-70.1, 12.3, -69.8, 12.7]
  note: Aruba is one of the four constituent countries of the Kingdom of the Netherlands, an island in the southern Caribbean just north of Venezuela. It left the Netherlands Antilles in 1986 for separate status within the Kingdom, which keeps responsibility for defence and foreign affairs.

- kind: territory
  id: curacao
  uid: Dv4q6Cdmqm
  name: Curaçao
  sovereign: netherlands
  status_line: Constituent country of the Kingdom of the Netherlands
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159321099}}
  expect: [-69.2, 12, -68.7, 12.5]
  note: Curaçao is one of the four constituent countries of the Kingdom of the Netherlands, an island off the coast of Venezuela. It became self-governing within the Kingdom in 2010, when the Netherlands Antilles was dissolved; it was once the centre of the Caribbean slave trade, and an oil refinery built for Venezuelan oil later revived its economy.

- kind: territory
  id: puerto-rico
  uid: yiVdkTNjAy
  name: Puerto Rico
  sovereign: united-states
  status_line: Unincorporated territory of the United States
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159321363}}
  expect: [-68, 17.9, -65.2, 18.6]
  note: Puerto Rico is an unincorporated organized territory of the United States with commonwealth status, an island between the Caribbean and the Atlantic east of the Dominican Republic. Spain ceded it to the US in 1898, and Puerto Ricans have been US citizens since 1917.

- kind: territory
  id: cayman-islands
  uid: HRaBqTzdJi
  name: Cayman Islands
  sovereign: united-kingdom
  status_line: British Overseas Territory
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320707}}
  expect: [-81.5, 19.2, -79.7, 19.8]
  note: The Cayman Islands are a British Overseas Territory of three islands in the Caribbean, south of Cuba and north-west of Jamaica. Once administered from Jamaica, they chose to remain British when the West Indies Federation broke up in 1962, and they are now a major offshore financial centre.

- kind: territory
  id: guadeloupe
  uid: 38hX6RNwme
  name: Guadeloupe
  sovereign: france
  status_line: Overseas department of France (part of France)
  geometry:
  - {layer: 10m_admin_0_map_units, select: {ne_id: 1159320653}}
  expect: [-61.9, 15.8, -60.9, 16.6]
  note: Guadeloupe is an overseas department and region of France in the eastern Caribbean, south-east of Puerto Rico, and an outermost region of the EU. Its two main islands are volcanic, mountainous Basse-Terre and low, limestone Grande-Terre.

- kind: territory
  id: martinique
  uid: CXEAF5ogTF
  name: Martinique
  sovereign: france
  status_line: Overseas department of France (part of France)
  geometry:
  - {layer: 10m_admin_0_map_units, select: {ne_id: 1159320657}}
  expect: [-61.3, 14.3, -60.7, 14.9]
  note: Martinique is a French overseas region in the eastern Caribbean, north of Trinidad and Tobago, run by a single territorial collectivity with the powers of both an overseas department and region, and an outermost region of the EU. In 1902 an eruption of its volcano, Montagne Pelée, destroyed the city of Saint-Pierre.

- kind: dispute
  id: crimea
  uid: WA5m7QzQAO
  name: Crimea
  parties: [ukraine, russia]
  geometry:
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159321217}}
  expect: [32.4, 44.3, 36.7, 46.3]
  note: Crimea is a peninsula on the north coast of the Black Sea, internationally recognised as part of Ukraine. Russia seized it in 2014 and claims to have annexed it; a UN General Assembly resolution that March reaffirmed Ukraine's territorial integrity and said the March 2014 referendum there had no validity.

- kind: dispute
  id: transnistria
  uid: 5ONrZqA7G7
  name: Transnistria
  parties: [moldova, {label: Transnistria}]
  geometry:
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159321047}}
  expect: [28.4, 46.5, 30, 48.2]
  note: Transnistria is a narrow strip of eastern Moldova, mostly on the left (east) bank of the Dniester (Nistru) River along the Ukrainian border, internationally recognised as part of Moldova. A Russian-backed separatist administration has run it since the early 1990s, after a brief war with Moldovan forces in 1992 ended in a ceasefire, and Russian forces have stayed there since Moldova became independent in 1991. Moldova seeks reintegration and the withdrawal of those troops.

- kind: dispute
  id: abkhazia
  uid: 54JjfJDESg
  name: Abkhazia
  parties: [georgia, {label: Abkhazia}]
  geometry:
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159320785}}
  expect: [39.9, 42.3, 42.2, 43.6]
  note: Abkhazia is a region on the Black Sea coast of north-western Georgia, internationally recognised as part of Georgia. Russian-backed de facto authorities have held most of it since the wars of 1991–93 and all of it since the 2008 Russia–Georgia war, after which Russia recognised its independence and kept troops there; only a few other states have followed, and some later withdrew recognition.

- kind: dispute
  id: south-ossetia
  uid: DPzzQrRxKV
  name: South Ossetia
  parties: [georgia, {label: South Ossetia}]
  geometry:
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159320787}}
  expect: [43.5, 41.9, 44.7, 42.8]
  note: South Ossetia is a region of north-central Georgia on the border with Russia, internationally recognised as part of Georgia, which calls it the Tskhinvali Region. Russian-backed de facto authorities have held most of it since the early-1990s conflict and all of it since fighting over it in August 2008 became the Russia–Georgia war, after which Russia recognised its independence and kept troops there.

- kind: dispute
  id: northern-cyprus
  uid: e52TxnvBxI
  name: Northern Cyprus
  parties: [cyprus, {label: Northern Cyprus}]
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320531}}
  expect: [32.5, 34.9, 34.7, 35.8]
  note: Northern Cyprus is the northern part of the island of Cyprus, internationally recognised as part of the Republic of Cyprus. In 1974, after a coup backed by Greece's military government, Turkish forces landed and took control of the north, and in 1983 the Turkish Cypriot-held area declared the "Turkish Republic of Northern Cyprus", which only Turkey recognises; UN peacekeepers arrived on the island in 1964. Formal UN-led reunification negotiations broke down in 2017.

- kind: dispute
  id: golan-heights
  uid: oYzEn5WYqO
  name: Golan Heights
  parties: [syria, israel]
  geometry:
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159320905}}
  expect: [35.5, 32.6, 36, 33.5]
  note: The Golan Heights is a plateau on Syria's south-western border with Israel. Israel captured it from Syria in the 1967 war and in 1981 extended its law and administration there, a step the UN Security Council declared null and void; the United States recognised Israeli sovereignty in 2019, but the UN regards it as occupied Syrian territory. After Assad's government fell in December 2024, Israeli forces also moved into the area of separation set in 1974.

- kind: dispute
  id: somaliland
  uid: JkIA5JQBbY
  name: Somaliland
  parties: [somalia, {label: Somaliland}]
  geometry:
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159321259}}
  expect: [42.6, 7.9, 49, 11.6]
  note: Somaliland is north-western Somalia, roughly the former British Somaliland, which was independent for a few days in 1960 before uniting with Italian Somaliland. It declared independence in 1991 and has governed itself since, but Somalia and the African Union regard it as part of Somalia; on 26 December 2025 Israel became the first UN member to recognise it. In 2023 forces of SSC-Khaatumo, which Somalia's federal government later recognised as a federal member state, renamed North Eastern State in 2025, took the Las Anod area in its east, which this outline includes.

- kind: dispute
  id: western-sahara
  uid: wndxpq7GzF
  name: Western Sahara
  parties: [morocco, {label: Sahrawi Republic (Polisario Front)}]
  geometry:
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159321037}}
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159321223}}
  expect: [-17.2, 20.7, -8.6, 27.7]
  note: Western Sahara, on Africa's Atlantic coast between Morocco and Mauritania, is a former Spanish territory that the UN lists as non-self-governing; Morocco claims it, and the Polisario Front seeks its independence. Since Spain withdrew in 1976, Morocco has controlled most of it, west of a sand berm, and the Polisario the strip to the east; a 1991 ceasefire monitored by the UN mission MINURSO, set up that year, broke down in late 2020, and low-level hostilities followed. In October 2025 Security Council resolution 2797 took Morocco's autonomy proposal as the basis for talks, while the Polisario held to self-determination.

- kind: dispute
  id: kashmir-indian-administered
  uid: qYWz011b5J
  name: Kashmir (Indian-administered)
  parties: [india, pakistan, china]
  geometry:
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159320869}}
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159320865}}
  - {layer: 10m_admin_0_countries, select: {ne_id: 1159320963}}
  expect: [73.7, 32.2, 79.7, 35.7]
  note: India administers the southern and eastern part of the former princely state of Kashmir, east and south of the 1972 Line of Control, and in 2019 reorganised it as two union territories, Jammu and Kashmir and Ladakh; it includes the Siachen Glacier area. Pakistan claims the territory, China claims parts of Ladakh, and India and Pakistan have fought over Kashmir since partition in 1947.

- kind: dispute
  id: kashmir-pakistani-administered
  uid: uCmlTrHFie
  name: Kashmir (Pakistani-administered)
  parties: [pakistan, india]
  geometry:
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159321157}}
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159321155}}
  expect: [72.4, 32.8, 77.1, 37.1]
  note: Pakistan administers the north-west of Kashmir as two territories outside its provinces, Azad Kashmir and Gilgit-Baltistan, divided from the Indian side by the 1972 Line of Control. India claims the whole area; the two countries fought over Kashmir in 1947–48, 1965 and 1999.

- kind: dispute
  id: arunachal-pradesh
  uid: ui8TE2cLP7
  name: Arunachal Pradesh
  alt_names: [Zangnan]
  parties: [india, china]
  geometry:
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159320857}}
  expect: [91.5, 26.8, 97.4, 29.4]
  note: Arunachal Pradesh is a Himalayan state in India's far north-east, administered by India. China claims all of it as "Zangnan" (South Tibet) because it rejects the 1914 McMahon Line agreed between Britain and Tibet; Chinese forces overran much of the area in the 1962 war, then withdrew.

- kind: dispute
  id: aksai-chin
  uid: Gu38h3G7An
  name: Aksai Chin
  parties: [china, india]
  geometry:
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159320487}}
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159320485}}
  expect: [75.8, 33.3, 80.4, 36.5]
  note: Aksai Chin is the high eastern part of Kashmir that China administers and India claims as part of Ladakh, separated from Indian-held land by the Line of Actual Control; China has held it since the 1950s and kept it in the 1962 Sino-Indian War. China also holds the Shaksgam tract north of the Karakoram, which Pakistan ceded to China in a 1963 boundary agreement that India does not recognise.

- kind: dispute
  id: kuril-islands
  uid: USOI1bRyvb
  name: Southern Kuril Islands
  alt_names: [Northern Territories]
  parties: [russia, japan]
  geometry:
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159321213}}
  expect: [145.3, 43.3, 148.9, 45.6]
  note: The southern Kurils (Iturup, Kunashir, Shikotan and the Habomai islets) lie just off Japan's northern island of Hokkaido. The Soviet Union took them in August–September 1945 and Russia administers them; Japan claims them as its Northern Territories, and the dispute has kept the two countries from signing a Second World War peace treaty. Russia suspended peace-treaty talks in March 2022.

- kind: dispute
  id: spratly-islands
  uid: V6Ch6dDZjH
  name: Spratly Islands
  parties: [china, taiwan, vietnam, philippines, malaysia, brunei]
  frame: {inset: true, inset_km: 900}  # a sea area of reefs: zoomed in past the default so the island group reads
  geometry:
  - {layer: 10m_geography_regions_polys, select: {ne_id: 1159103863}}
  expect: [111.8, 7.1, 117.9, 12.1]
  note: The Spratly Islands are a scatter of small islands, reefs and shoals in the southern South China Sea, amid rich fishing grounds and possible oil and gas. China, Taiwan and Vietnam claim them all, Malaysia and the Philippines claim parts, and all five occupy some features; Brunei claims an overlapping maritime zone. In 2016 an arbitral tribunal in a case brought by the Philippines found no legal basis for China's claimed historic rights inside its "nine-dash line"; China rejects the ruling, and control is still split among the claimants.

- kind: dispute
  id: essequibo
  uid: xTEP7LSmy5
  name: Essequibo
  alt_names: [Guayana Esequiba]
  parties: [guyana, venezuela]
  geometry:
  - {layer: 10m_admin_0_disputed_areas, select: {ne_id: 1159320821}}
  expect: [-61.5, 1.1, -58.1, 8.6]
  note: Essequibo (Guayana Esequiba) is the land west of the Essequibo River, which Guyana administers and Venezuela claims. Guyana relies on the 1899 arbitral award that fixed the boundary; Venezuela rejects the award, and in 2023 held a referendum backing its claim. In 2018 Guyana took the dispute to the International Court of Justice, which heard the merits on 4–11 May 2026.
