  expect: [-31.29, 30.02, -6.2, 42.16]
  capital:
    name: Lisbon
    ne_id: 1159151273
    expect: [-9.2, 38.67, -9.1, 38.77]
    note: >-
      Portugal's capital is a coastal city on the Atlantic side of the country. It was largely destroyed by the 1755
      earthquake. Its Monastery of the Hieronymites and Tower of Belém are World Heritage sites.

