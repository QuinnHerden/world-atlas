# World Atlas country cards (ADR 0005, 0008): a country card and, unless `capital: null`, a capital card per state.
# Seeded once by tools/seed_countries.py (since removed); edit here. Region membership, pocket hosts and order are not
# stored here: they come from data/curriculum.yaml, and every id must be in one of its regions.
#
# - geometry: Natural Earth rows; the first is the base, `subtract` parts are cut out (recognised borders, ADR 0008).
#   The adjacency graph and the region outlines read it too (countries_ne.py).
# - mainland: keep only the outline's parts wholly inside this box (drops remote outliers that get no card). A display
#   crop for the card only: adjacency and region derivation use the full outline (countries_ne.py).
# - expect: the card outline's bbox (lon_min > lon_max crosses 180°); a capital's is a box around its point.
# - tier 3: microstates and small island states only.
# - note: the P2.7 blurbs, copied as written.

- id: portugal
  name: Portugal
  uids: {country: J6dTD8BNLJ, capital: VwNbdkEAwJ}
  tier: 1
  note: >-
    In southwestern Europe on the North Atlantic, west of Spain, its only land neighbour. A global maritime power in
    the 15th and 16th centuries, it lost much of its wealth after the 1755 earthquake that destroyed Lisbon.
  geometry:
